<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso Práctico - Verificar Web Creada</title>
    <!-- Vinculación de la hoja de estilos externa -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- ENCABEZADO SUPERIOR: Solo contiene el logo -->
<header class="header">
    <div class="logo-container">
        <img src="logo.png" alt="Logotipo Anillos Olímpicos" class="logo">
    </div>
</header>

<!-- CONTENEDOR PRINCIPAL -->
<div class="main-container">

    <!-- Columna Izquierda: Encabezado 1, Reloj y Artículos -->
    <main class="content">
        <!-- El Encabezado 1 va aquí dentro -->
        <h1>Encabezado 1</h1>

        <!-- Reloj con la hora -->
        <div id="reloj" class="reloj"></div>

        <article>
            <h2>Artículo 1</h2>
            <p>Lorem ipsum dolor sit amet...</p>
        </article>

        <article>
            <h2>Artículo 2</h2>
            <p>Integer et posuere tellus...</p>
        </article>
    </main>

    <!-- Columna Derecha: Menú lateral -->
    <aside class="sidebar">
        <nav class="nav-menu">
            <ul>
                <li><a href="#">Vínculo uno</a></li>
                <li><a href="#">Vínculo dos</a></li>
                <li><a href="#">Vínculo tres</a></li>
                <li><a href="#">Vínculo cuatro</a></li>
            </ul>
        </nav>
        <div class="sidebar-text">
            <p>Los vínculos representan un menú de navegación.</p>
        </div>
    </aside>

</div>

    <!-- Pie de página a todo el ancho -->
    <footer class="footer">
        <p>Pie de página</p>
        <address>Calle Torrecedeira N.º 43</address>
    </footer>

    <!-- Carga del script JS (o script.min.js) al final del body -->
    <script src="script.min.js"></script>
</body>
</html>
