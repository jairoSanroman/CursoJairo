<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instrucciones para un script</title>

  <script>
    // Comentario en el script de la cabecera

    // 1. Variables definidas e inicializadas en la cabecera
    var nombre = "Jairo";
    var apellidos = "Sanromán";
  </script>

</head>

<!-- 4. El evento onload ejecuta el script al cargar la página -->
<body onload="alert('Página cargada')">

  <h1>Instrucciones para un script</h1>

  <script>
    // Comentario en el script del cuerpo del html

    // 2. Escribe en la página el texto y las variables declaradas en la cabecera
    document.write("Escribiendo en el cuerpo");
    document.write("<br>");
    document.write(nombre + " " + apellidos);
  </script>

</body>
</html>
