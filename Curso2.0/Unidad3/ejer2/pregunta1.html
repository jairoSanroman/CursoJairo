<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Datos de personas</title>
</head>

<body>

<script>

var nombre1;
var edad1;
var altura1;

var nombre2;
var edad2;
var altura2;

nombre1 = "Pepe";
edad1 = 40;
altura1 = 1.60;

nombre2 = "Ana";
edad2 = 30;
altura2 = 1.70;

document.write(nombre1 + ", " + edad1 + " años, " + altura1 + " m<br>");
document.write(nombre2 + ", " + edad2 + " años, " + altura2 + " m<br>");

var mediaEdad = (edad1 + edad2) / 2;
var mediaAltura = (altura1 + altura2) / 2;

document.write("Media de edad: " + mediaEdad + " años<br>");
document.write("Media de altura: " + mediaAltura + " m");

</script>

</body>
</html>
