<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparar números</title>
</head>

<body>

<script>

var numero1;
var numero2;

numero1 = Number(prompt("Introduce el primer número:"));
numero2 = Number(prompt("Introduce el segundo número:"));

if (numero1 > numero2) {
    document.write("El número mayor es: " + numero1);
} else if (numero2 > numero1) {
    document.write("El número mayor es: " + numero2);
} else {
    document.write("Los dos números son iguales");
}

</script>

</body>
</html>
