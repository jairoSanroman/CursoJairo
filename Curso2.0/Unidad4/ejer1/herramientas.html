<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herramientas para scripts</title>
</head>
<body>

  <h1>Herramientas para la creación de scripts</h1>

  <!-- f. Mensaje visible solo para usuarios con JavaScript deshabilitado -->
  <noscript>
    <p>Su navegador tiene JavaScript deshabilitado. Para ver el contenido completo de esta página, por favor active JavaScript en la configuración de su navegador.</p>
  </noscript>
  <!-- <noscript>: su contenido solo se muestra cuando JavaScript está desactivado
       o no está disponible en el navegador del usuario. -->

  <!-- b. Llamada al archivo JavaScript externo -->
  <script src="hola.js"></script>
  <!-- src="hola.js": ruta relativa al archivo JS externo.
       El archivo hola.js debe estar en la misma carpeta que este HTML.
       Al cargar la página se ejecuta automáticamente el script. -->

</body>
</html>
