<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividad - Efectos con imágenes</title>

    <style>

        /* -------------------------------
           ESTILOS GENERALES
        -------------------------------- */

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 50px;
        }

        .galeria {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-top: 30px;
            min-height: 120px;
        }


        /* ==================================================
           ACTIVIDAD 3
           EFECTO CON JAVASCRIPT
           ================================================== */

        .imagen-js {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .casa-js {
            width: 100px;
            height: auto;
        }


        /* ==================================================
           ACTIVIDAD 4 Y 5
           EFECTO CON CSS
           ================================================== */

        .imagen-css {

            /* Imagen en blanco y negro */
            filter: grayscale(100%);

            /*
             * Transición de 1 segundo.
             * linear = velocidad constante.
             */
            transition:
                filter 1s linear,
                transform 1s linear;

            -webkit-transition:
                filter 1s linear,
                transform 1s linear;

            cursor: pointer;

            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .casa-css {
            width: 100px;
            height: auto;
        }


        /* Al pasar el ratón:
           vuelve a aparecer el color */
        .imagen-css:hover {
            filter: grayscale(0%);
        }


        /* ==================================================
           ACTIVIDAD 6
           FLECHA IZQUIERDA
           GIRA 20 GRADOS
           ================================================== */

        /* Flecha izquierda */
    .flecha-izquierda {
    transform: scaleX(-1);
    }

    .flecha-izquierda:hover {
    filter: grayscale(0%);
    transform: scaleX(-1) rotate(-20deg) scale(0.8);
    }
    .flecha-izquierda-js {
    transform: scaleX(-1);
}


        /* ==================================================
           ACTIVIDAD 7
           CASA
           AUMENTA UN 20%
           ================================================== */

        .casa-css:hover {

            filter: grayscale(0%);

            transform: scale(1.2);

        }


        /* ==================================================
           ACTIVIDAD 8
           FLECHA DERECHA
           GIRA 20 GRADOS
           Y REDUCE UN 20%
           ================================================== */

        .flecha-derecha:hover {

            filter: grayscale(0%);

            transform: rotate(20deg) scale(0.8);

        }

    </style>
</head>


<body>

    <h1>Imágenes y efectos</h1>


    <!-- ==================================================
         ACTIVIDAD 3
         JAVASCRIPT
         ================================================== -->

    <h2>3. Efecto utilizando JavaScript</h2>

    <p>
        Pasa el ratón por encima de las imágenes para cambiar
        la imagen de blanco y negro a color.
    </p>

    <div class="galeria">


        <!-- FLECHA IZQUIERDA -->

        <img
    id="flechaIzquierdaJS"
    class="imagen-js flecha-izquierda-js"
    src="flecha-derecha.png"
    alt="Flecha izquierda"
>


        <!-- CASA -->

        <img
            id="casaJS"
            class="casa-js"
            src="casa.png"
            alt="Casa"
        >


        <!-- FLECHA DERECHA -->

        <img
            id="flechaDerechaJS"
            class="imagen-js"
            src="flecha-derecha.png"
            alt="Flecha derecha"
        >

    </div>


    <!-- ==================================================
         ACTIVIDAD 4, 5, 6, 7 Y 8
         CSS
         ================================================== -->

    <h2>4, 5, 6, 7 y 8. Efectos utilizando CSS</h2>

    <p>
        Pasa el ratón por encima de las imágenes.
    </p>

    <div class="galeria">


        <!-- FLECHA IZQUIERDA -->

        <img
            src="flecha-derecha.png"
            alt="Flecha izquierda"
            class="imagen-css flecha-izquierda"
        >


        <!-- CASA -->

        <img
            src="casa.png"
            alt="Casa"
            class="imagen-css casa-css"
        >


        <!-- FLECHA DERECHA -->

        <img
            src="flecha-derecha.png"
            alt="Flecha derecha"
            class="imagen-css flecha-derecha"
        >

    </div>


    <!-- ==================================================
         JAVASCRIPT
         ACTIVIDAD 3
         ================================================== -->

    <script>

        /*
         * Las imágenes originales son las imágenes a color.
         * CSS filter: grayscale() permite mostrar temporalmente
         * la versión en blanco y negro.
         *
         * Para la actividad de sustitución con JavaScript,
         * usamos la propiedad filter para simular el estado
         * de la imagen.
         */


        const flechaIzquierdaJS =
            document.getElementById("flechaIzquierdaJS");

        const casaJS =
            document.getElementById("casaJS");

        const flechaDerechaJS =
            document.getElementById("flechaDerechaJS");


        /* -------------------------------
           FLECHA IZQUIERDA
        -------------------------------- */

        flechaIzquierdaJS.style.filter = "grayscale(100%)";

        flechaIzquierdaJS.addEventListener("mouseover", function () {

            this.style.filter = "grayscale(0%)";

        });

        flechaIzquierdaJS.addEventListener("mouseout", function () {

            this.style.filter = "grayscale(100%)";

        });


        /* -------------------------------
           CASA
        -------------------------------- */

        casaJS.style.filter = "grayscale(100%)";

        casaJS.addEventListener("mouseover", function () {

            this.style.filter = "grayscale(0%)";

        });

        casaJS.addEventListener("mouseout", function () {

            this.style.filter = "grayscale(100%)";

        });


        /* -------------------------------
           FLECHA DERECHA
        -------------------------------- */

        flechaDerechaJS.style.filter = "grayscale(100%)";

        flechaDerechaJS.addEventListener("mouseover", function () {

            this.style.filter = "grayscale(0%)";

        });

        flechaDerechaJS.addEventListener("mouseout", function () {

            this.style.filter = "grayscale(100%)";

        });

    </script>

</body>

</html>
