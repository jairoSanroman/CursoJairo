<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estilos CSS</title>

  <style>
    /* Reglas CSS incrustadas dentro del propio documento HTML */

    h1 {
      font-size: 50px;
      color: blue;
      font-family: Verdana;
      /* Se ha movido el estilo inline del h1 a esta regla CSS */
    }

    h2 {
      font-size: 30px;
      color: red;
      font-family: Arial;
      /* Se ha movido el estilo inline del h2 a esta regla CSS */
    }

    p {
      font-size: 20px;
      color: yellow;
      font-family: Arial;
      background: black;
      /* Se ha movido el estilo inline del párrafo a esta regla CSS */
    }
  </style>

</head>
<body>

  <h1>Titular de la página</h1>
  <!-- Se ha eliminado el atributo style del h1 -->

  <h2>Subtítulo de la página</h2>
  <!-- Se ha eliminado el atributo style del h2 -->

  <p>Un párrafo de texto como otro cualquiera.</p>
  <!-- Se ha eliminado el atributo style del párrafo -->

</body>
</html>
