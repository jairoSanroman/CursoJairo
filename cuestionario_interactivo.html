        }

            top: 10px;

            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);

            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;

            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
        }

            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            background: var(--primary-hover);
        }

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }

            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .question-number {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            background: #fff;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--primary);
            background: #f0f6ff;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .option-item.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-text) !important;
        }

        .option-item.disabled {
            cursor: default;
            opacity: 0.8;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            line-height: 1.5;

            background: #f0fdf4;
            border-left: 4px solid var(--correct-border);

        }

            display: block;
            background: #fef2f2;
            border-left: 4px solid var(--incorrect-border);
            color: #991b1b;
        }

            font-size: 0.9em;
            color: #0f172a;

</head>

let userAnswers = {};
let currentFilter = 'all';

function renderQuestions() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    const filtered = currentFilter === 'all' 
        ? questionsData 
        : questionsData.filter(q => q.cat === currentFilter);

    filtered.forEach((qObj, idx) => {
        const qGlobalIndex = questionsData.indexOf(qObj);
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qGlobalIndex}`;

        const isAnswered = userAnswers.hasOwnProperty(qGlobalIndex);
        const selectedOption = userAnswers[qGlobalIndex];

        let optionsHTML = '';
        qObj.options.forEach((opt, optIdx) => {
            let optionClass = 'option-item';
            let checkedAttr = '';

            if (isAnswered) {
                optionClass += ' disabled';
                if (optIdx === qObj.correct) {
                    optionClass += ' correct';
                }
                if (selectedOption === optIdx && selectedOption !== qObj.correct) {
                    optionClass += ' incorrect';
                }
                if (selectedOption === optIdx) {
                    checkedAttr = 'checked';
                }
            }

            optionsHTML += `
                <label class="${optionClass}" onclick="handleSelect(${qGlobalIndex}, ${optIdx})">
                    <input type="radio" name="q-${qGlobalIndex}" ${checkedAttr} ${isAnswered ? 'disabled' : ''}>
                    <span>${String.fromCharCode(97 + optIdx)}. ${opt}</span>
                </label>
            `;
        });

        let explanationHTML = '';
        if (isAnswered) {
            const isCorrect = selectedOption === qObj.correct;
            const expClass = isCorrect ? 'explanation visible-correct' : 'explanation visible-incorrect';
            const statusText = isCorrect ? '<strong>¡Correcto!</strong> ' : '<strong>Incorrecto.</strong> ';
            explanationHTML = `<div class="${expClass}">${statusText}${qObj.exp}</div>`;
        }

        card.innerHTML = `
            <div class="question-header">
                <span class="question-number">${qObj.section} - Pregunta ${idx + 1}</span>
            </div>
            <div class="question-title">${qObj.q}</div>
            <div class="options-list">${optionsHTML}</div>
            ${explanationHTML}
        `;

        container.appendChild(card);
    });

    updateStats();
}

function handleSelect(questionIndex, optionIndex) {
    if (userAnswers.hasOwnProperty(questionIndex)) return; // Ya respondida

    userAnswers[questionIndex] = optionIndex;
    renderQuestions();
}

function updateStats() {
    const totalQuestions = questionsData.length;
    const answeredCount = Object.keys(userAnswers).length;
    let correctCount = 0;

    Object.keys(userAnswers).forEach(qIdx => {
        if (userAnswers[qIdx] === questionsData[qIdx].correct) {
            correctCount++;
        }
    });

    const percentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
    document.getElementById('score-display').innerText = 
        `Respuestas correctas: ${correctCount} / ${answeredCount} (Total test: ${totalQuestions}) - Aciertos: ${percentage}%`;
}

function filterCategory(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderQuestions();
}

function resetQuiz() {
    userAnswers = {};
    renderQuestions();
}

// Inicializar al cargar
document.addEventListener('DOMContentLoaded', renderQuestions);
